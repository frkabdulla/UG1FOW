<!DOCTYPE html>
<html>
<head>
<title>Practical 34 - HTML (Element) Selector</title>
<style>
h1 {
    color: darkgreen;
}
p {
    color: black;
    font-family: Arial, sans-serif;
}
li {
    color: brown;
}
</style>
</head>
<body>
<h1>This heading is styled using the h1 element selector.</h1>
<p>This paragraph is styled using the p element selector.</p>
<ul>
<li>This list item is styled using the li element selector.</li>
<li>So is this one.</li>
</ul>
</body>
</html>
