<!DOCTYPE html>
<html>
<head>
<title>Practical 46 - Table Formatting with Background Color</title>
<style>
table {
    border-collapse: collapse;
    width: 50%;
}
th, td {
    border: 1px solid black;
    padding: 10px 15px;
    text-align: left;
}
th {
    background-color: #4CAF50;
    color: white;
}
tr:nth-child(even) {
    background-color: #f2f2f2;
}
tr:nth-child(odd) {
    background-color: #ffffff;
}
tr:hover {
    background-color: #ddd;
}
</style>
</head>
<body>
<table>
<tr>
<th>Name</th>
<th>Post</th>
<th>Salary</th>
</tr>
<tr>
<td>Geeta</td>
<td>Manager</td>
<td>20000</td>
</tr>
<tr>
<td>Ravi</td>
<td>Clerk</td>
<td>5000</td>
</tr>
<tr>
<td>Mohan</td>
<td>Clerk</td>
<td>5000</td>
</tr>
<tr>
<td>Shyam</td>
<td>Clerk</td>
<td>5000</td>
</tr>
</table>
</body>
</html>
