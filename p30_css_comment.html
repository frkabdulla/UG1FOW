<!DOCTYPE html>
<html>
<head>
<title>Practical 30 - CSS Comment</title>
<style>
/* This is a CSS comment. It is not displayed on the web page and is used to explain the code. */
h1 {
    color: teal; /* This sets the heading color to teal */
}
/* p { color: red; }  -- this rule is commented out and will not apply */
p {
    color: navy;
}
</style>
</head>
<body>
<h1>CSS Comment Example</h1>
<p>This paragraph demonstrates the use of CSS comments in the style sheet above.</p>
</body>
</html>
