<!DOCTYPE html>
<html>
<head>
<title>Practical 43 - Thumbnail Image</title>
<style>
.thumbnail {
    border: 1px solid #ccc;
    padding: 4px;
    width: 100px;
    transition: 0.2s;
}
.thumbnail:hover {
    border-color: #555;
}
</style>
</head>
<body>
<a href="large-image.jpg" target="_blank">
<img src="large-image.jpg" class="thumbnail" alt="Click to view full-size image">
</a>
<p>Click the thumbnail above to open the full-size image in a new tab.</p>
</body>
</html>
