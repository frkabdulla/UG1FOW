<!DOCTYPE html>
<html>
<head>
<title>Practical 42 - Border on Only 3 Sides</title>
<style>
div {
    width: 300px;
    padding: 20px;
    border-top: 4px solid green;
    border-left: 4px dashed red;
    border-right: 4px dotted blue;
    border-bottom: none;
}
</style>
</head>
<body>
<div>
This box has a border on only three sides: top (solid green), left (dashed red), and right (dotted blue). The bottom has no border.
</div>
</body>
</html>
