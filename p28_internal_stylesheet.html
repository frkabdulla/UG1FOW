<!DOCTYPE html>
<html>

<head>
    <title>Practical 28 - Internal Stylesheet</title>
    <style>
        body {
            background-color: #f0f8ff;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }

        p {
            color: darkgreen;
            font-size: 18px;
            font-family: Georgia, serif;
        }
    </style>
</head>

<body>
    <h1>Internal CSS Example</h1>
    <p>This paragraph is styled using an internal stylesheet, defined within a style tag in the head section of this
        document.</p>
</body>

</html>
