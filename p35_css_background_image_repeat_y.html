<!DOCTYPE html>
<html>
<head>
<title>Practical 35 - Insert Image via CSS (Vertical Repeat) + Background Color</title>
<style>
body {
    background-color: #d3f8e2;
    background-image: url('pattern.png');
    background-repeat: repeat-y;
    background-position: left top;
}
</style>
</head>
<body>
<h1>CSS Background Image Demo</h1>
<p>This page has a background color (light green) and a background image (pattern.png) that repeats vertically only, using background-repeat: repeat-y.</p>
</body>
</html>
