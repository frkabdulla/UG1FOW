<!DOCTYPE html>
<html>
<head>
<title>Practical 48 - Student Registration Form with Validation</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #eef2f5;
}
form {
    width: 380px;
    margin: 40px auto;
    background-color: white;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.15);
}
h2 {
    text-align: center;
    color: #2c3e50;
}
label {
    display: block;
    margin-top: 15px;
    margin-bottom: 5px;
    font-weight: bold;
    color: #444;
}
input, select {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
}
input:focus, select:focus {
    outline: none;
    border-color: #2c82c9;
}
input:invalid:not(:placeholder-shown) {
    border-color: #e74c3c;
}
input:valid:not(:placeholder-shown) {
    border-color: #27ae60;
}
small {
    color: #777;
    font-size: 12px;
}
input[type="submit"] {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    background-color: #2c82c9;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}
input[type="submit"]:hover {
    background-color: #256ea8;
}
</style>
</head>
<body>
<form action="#" method="post">
<h2>Student Registration Form</h2>

<label for="sname">Full Name</label>
<input type="text" id="sname" name="sname" placeholder="Enter your full name" pattern="[A-Za-z ]{3,40}" title="Name should be 3-40 letters only" required>

<label for="roll">Roll Number</label>
<input type="text" id="roll" name="roll" placeholder="e.g. 21IT045" pattern="[A-Za-z0-9]{5,15}" title="Roll number should be 5-15 alphanumeric characters" required>

<label for="email">Email Address</label>
<input type="email" id="email" name="email" placeholder="student@example.com" required>

<label for="phone">Phone Number</label>
<input type="tel" id="phone" name="phone" placeholder="10 digit mobile number" pattern="[0-9]{10}" title="Enter a valid 10 digit phone number" required>
<small>Format: 10 digits, no spaces or symbols.</small>

<label for="dob">Date of Birth</label>
<input type="date" id="dob" name="dob" required>

<label for="course">Course</label>
<select id="course" name="course" required>
<option value="">Select Course</option>
<option value="mca">MCA</option>
<option value="msc-it">MSc-IT</option>
<option value="msc-ds">MSc-DS</option>
<option value="bca">BCA</option>
</select>

<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Minimum 8 characters" minlength="8" required>

<label for="confirm-password">Confirm Password</label>
<input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter password" minlength="8" required>

<input type="submit" value="Register">
</form>
</body>
</html>
