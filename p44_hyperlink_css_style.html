<!DOCTYPE html>
<html>
<head>
<title>Practical 44 - Hyperlink CSS Style</title>
<style>
a:link {
    color: blue;
    text-decoration: none;
}
a:visited {
    color: purple;
}
a:hover {
    color: red;
    text-decoration: underline;
}
a:active {
    color: orange;
}
</style>
</head>
<body>
<p><a href="https://www.google.com" target="_blank">Visit Google</a></p>
<p><a href="https://www.wikipedia.org" target="_blank">Visit Wikipedia</a></p>
<p>Hover over the links above to see the hover style, and click to see the active/visited styles.</p>
</body>
</html>
