<!DOCTYPE html>
<html>
<head>
<title>Practical 38 - Margin Property (Internal Stylesheet)</title>
<style>
div {
    background-color: lightyellow;
    border: 1px solid black;
    margin-bottom: 15px;
}
.margin-top { margin-top: 50px; }
.margin-right { margin-right: 100px; background-color: lightblue; }
.margin-bottom { margin-bottom: 50px; }
.margin-left { margin-left: 100px; background-color: lightpink; }
.margin-shorthand { margin: 20px 40px 20px 40px; background-color: lightgreen; }
.margin-auto { margin: 10px auto; width: 200px; background-color: lavender; text-align: center; }
</style>
</head>
<body>
<div class="margin-top">This div demonstrates margin-top: 50px.</div>
<div class="margin-right">This div demonstrates margin-right: 100px.</div>
<div class="margin-bottom">This div demonstrates margin-bottom: 50px.</div>
<div class="margin-left">This div demonstrates margin-left: 100px.</div>
<div class="margin-shorthand">This div demonstrates the margin shorthand: 20px 40px 20px 40px.</div>
<div class="margin-auto">This div demonstrates margin: auto (horizontally centered).</div>
</body>
</html>
