<!DOCTYPE html>
<html>
<head>
<title>Practical 41 - Top and Bottom Border Only</title>
<style>
div {
    width: 300px;
    padding: 20px;
    border-top: 4px dashed red;
    border-bottom: 4px double blue;
    border-left: none;
    border-right: none;
}
</style>
</head>
<body>
<div>
This box has only a top and bottom border. The top border is red and dashed. The bottom border is blue and double.
</div>
</body>
</html>
