<!DOCTYPE html>
<html>
<head>
<title>Practical 32 - Class Selector</title>
<style>
.highlight {
    color: white;
    background-color: darkorange;
    padding: 5px;
}
.note {
    font-style: italic;
    color: gray;
}
</style>
</head>
<body>
<p class="highlight">This paragraph uses the .highlight class selector.</p>
<h2 class="highlight">This heading also uses the same .highlight class selector.</h2>
<p class="note">This paragraph uses a different class, .note.</p>
</body>
</html>
